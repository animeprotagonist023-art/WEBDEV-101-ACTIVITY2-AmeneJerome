<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        
        
        .blue-box {
            position: relative;         
            background: blue;
            width: 500px;
            height: 300px;
            margin-top: 200px;
            margin-left: 200px;
            overflow: visible;          
        }

        
        
        .red-circle {
            position: absolute;
            background: red;
            width: 150px;
            height: 150px;
            border-radius: 50%;         
            left: 250px;                
            top: 150px;                 
        }
    </style>
</head>
<body>
    <div class="blue-box">
        <div class="red-circle"></div>
    </div>
</body>
</html>
