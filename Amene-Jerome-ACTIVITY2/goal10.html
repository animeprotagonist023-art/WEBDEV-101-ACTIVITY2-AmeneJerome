<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        body {
            margin: 0;
            padding: 16px;
            font-family: serif;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        
        .red-para,
        .green-para,
        .blue-para {
            display: block;
            width: 500px;
            height: 300px;
            color: white;
            padding: 6px;
            margin-bottom: 4px;
        }

        .red-para {
            background: red;
        }

        .green-para {
            background: green;
        }

        .blue-para {
            background: blue;
        }
    </style>
</head>
<body>
    <h1>CSS Display Property</h1>

    
    <p class="red-para">Red Paragraph</p>
    <p class="green-para">Green Paragraph</p>
    <p class="blue-para">Blue Paragraph</p>
</body>
</html>
