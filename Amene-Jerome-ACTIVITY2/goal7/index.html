<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Combining CSS Selectors</title>
  <style>
    
    h1 {
      color: purple;
    }

    h2 {
      color: purple;
    }

    
    .done {
      color: red;
      font-style: italic;
    }

    
    .list li {
      color: blue;
    }

    
    .list li.done {
      color: green;
    }

    
    ul .done {
      font-size: 0.65em;
      color: black;
      font-style: normal;
    }
  </style>
</head>



<body>
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="done">Read</li>
      <li class="done">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <p class="done">Other items</p>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>

</body>

</html>
