<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important CSS Properties</title>
    <style>
        
        body {
            background: rgb(103, 136, 245);
            margin: 0;
            padding: 16px;
        }

        
        .top {
            color: white;
        }

        
        .color-demo {
            color: orangered;
        }

        
        .size-demo {
            font-size: 50px;
            color: white;
        }

        
        .weight-demo {
            font-weight: 999;
            color: white;
        }

        
        .family-demo {
            font-family: cursive;
            color: white;
        }

        
        .align-demo {
            text-align: right;
            color: white;
        }
    </style>
</head>
<body>
    <h1 class="top">Important CSS Properties</h1>
    <p class="color-demo">Color</p>
    <p class="size-demo">Font Size</p>
    <p class="weight-demo">Font Weight</p>
    <p class="family-demo">Font Family</p>
    <p class="align-demo">Text Align</p>
</body>
</html>
