<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Colors</title>
    <style>
        body {
            background-color: rgb(249, 228, 210);  
            color: white;
            margin: 0;
            padding: 0;
        }

        
        .light-brown {
            background: rgb(130, 178, 140);
            padding: 10px;
            margin-bottom: 15px;
        }

        
        .light-green {
            background: rgb(185, 130, 65);
            padding: 10px;
        }

        h1, h2 {
            margin: 0;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="light-brown"><h1>Hello</h1></div>
    <div class="light-green"><h2>World</h2></div>
</body>
</html>
