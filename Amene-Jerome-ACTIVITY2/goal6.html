<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model — Nested</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        
        .outer {
            border: 10px solid rgb(94, 0, 94);
            background: blue;
            padding: 10px;
        }

        
        .inner {
            padding: 10px;
        }

        
        .yellow-text {
            color: yellow;
            padding: 10px;
            margin: 0;
        }

        
        .white-bar {
            color: white;
            background: red;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <p class="yellow-text">Yellow Text</p>
            <div class="white-bar">White Text</div>
            <p class="yellow-text">Yellow Text</p>
            <div class="white-bar">White Text</div>
        </div>
    </div>
</body>
</html>
